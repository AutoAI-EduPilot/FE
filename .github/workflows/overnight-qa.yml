name: Overnight service QA

on:
  workflow_dispatch:
    inputs:
      deadline:
        description: ISO-8601 deadline including timezone
        required: true
        default: '2026-09-12T10:00:00+09:00'
      create_issues:
        description: Create or update deduplicated FE/BE/AI issues
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  issues: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 660
    env:
      QA_CREATE_ISSUES: ${{ inputs.create_issues && secrets.QA_ISSUE_TOKEN != '' }}
      QA_DEADLINE: ${{ inputs.deadline }}
      GH_TOKEN: ${{ secrets.QA_ISSUE_TOKEN }}
      DEV_QA_LEARNER_EMAIL: ${{ secrets.DEV_QA_LEARNER_EMAIL }}
      DEV_QA_LEARNER_PASSWORD: ${{ secrets.DEV_QA_LEARNER_PASSWORD }}
      DEV_QA_INSTRUCTOR_EMAIL: ${{ secrets.DEV_QA_INSTRUCTOR_EMAIL }}
      DEV_QA_INSTRUCTOR_PASSWORD: ${{ secrets.DEV_QA_INSTRUCTOR_PASSWORD }}
      DEV_QA_ADMIN_EMAIL: ${{ secrets.DEV_QA_ADMIN_EMAIL }}
      DEV_QA_ADMIN_PASSWORD: ${{ secrets.DEV_QA_ADMIN_PASSWORD }}
      PROD_QA_LEARNER_EMAIL: ${{ secrets.PROD_QA_LEARNER_EMAIL }}
      PROD_QA_LEARNER_PASSWORD: ${{ secrets.PROD_QA_LEARNER_PASSWORD }}
      PROD_QA_INSTRUCTOR_EMAIL: ${{ secrets.PROD_QA_INSTRUCTOR_EMAIL }}
      PROD_QA_INSTRUCTOR_PASSWORD: ${{ secrets.PROD_QA_INSTRUCTOR_PASSWORD }}
      PROD_QA_ADMIN_EMAIL: ${{ secrets.PROD_QA_ADMIN_EMAIL }}
      PROD_QA_ADMIN_PASSWORD: ${{ secrets.PROD_QA_ADMIN_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Run until the deadline
        run: npm run test:overnight
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overnight-qa-${{ github.run_id }}
          path: qa-artifacts
          if-no-files-found: warn
          retention-days: 14
